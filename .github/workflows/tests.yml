name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install fonts and media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk ffmpeg
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
      - name: Check code
        run: python -m ruff check main.py webui.py alice_tieba_core alice_monitor tests
      - name: Run regressions
        run: python -m pytest tests -q
